# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  GREETING: Hello, world!

tasks:
  run:
    desc: Run the system
    deps:
      - run-agent
      - run-vector
    silent: true

  run-agent:
    desc: Run the agent
    cmds:
      - go run cmd/app/main.go
    silent: true

  run-vector:
    desc: Run vector
    cmds:
      # vector fails at startup if data_dir doesn't exist; sinks/sources
      # under /tmp/heimdall need their dirs too.
      - mkdir -p /tmp/heimdall/vector-data /tmp/heimdall/data /tmp/heimdall/logs/api /tmp/heimdall/logs/worker
      - vector --config vector.yaml
    silent: true
