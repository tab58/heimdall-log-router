# Heimdall Log Router Configuration
#
# api_key: Anthropic API key (falls back to ANTHROPIC_API_KEY env var)
# api_key: "sk-your-key-here"

# HTTP server listen address
server_port: ":7077"

# Debounce interval for auto-analysis of error logs
debounce_time: 5s

# Directory for plugin error logs
plugin_log_dir: "/tmp/heimdall/logs/"

# Plugin definitions
# Each plugin has a name, type, and type-specific config.
# plugins:
#   - name: "my-webhook"
#     type: "webhook"
#     config:
#       url: "https://example.com/hook"
